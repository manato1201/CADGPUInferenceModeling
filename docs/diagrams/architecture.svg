<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 860" width="1500" role="img" aria-labelledby="t d"><title id="t">CADGPUInferenceModeling の構成</title><desc id="d">DXF の図面は、端点のスナップと壁厚の推定を経て押し出され、屋根とテクスチャが付いて、Unity や UE 向けの 3D アセットになる。逆向きでは、メッシュを Z バッファで隠線判定し、三面図と平面図の DXF にする。GPU 推論(TripoSR・Zero123++)は、外観の推論に使う。</desc><style>
:root{--bg:#ffffff;--grid:#edf0f4;--ink:#1d2433;--muted:#667085;--card:#ffffff;--cardline:#d0d5dd;--lab:#ffffff;
--blue:#1a73e8;--orange:#e8710a;--teal:#0f9d8a;--red:#d92d20;--gray:#667085;--purple:#7a5af8;
--f-blue:#f3f7fe;--f-orange:#fdf6ee;--f-teal:#f0f9f7;--f-red:#fef5f4;--f-gray:#f6f7f9;--f-purple:#f6f3ff}
@media (prefers-color-scheme: dark){:root{--bg:#14171d;--grid:#1f242d;--ink:#e6e9ef;--muted:#98a2b3;--card:#1b2029;--cardline:#3a4150;--lab:#14171d;
--blue:#6ea8fe;--orange:#f5a25d;--teal:#52c7b4;--red:#f97066;--gray:#98a2b3;--purple:#a99bff;
--f-blue:#17202e;--f-orange:#271f17;--f-teal:#152422;--f-red:#2a1b1a;--f-gray:#1a1e26;--f-purple:#1f1b2e}}
text{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;fill:var(--ink)}
.mono{font-family:"JetBrains Mono","Cascadia Mono",Consolas,"Courier New",monospace}
.title{font-size:16px;font-weight:600;text-anchor:middle}
.sub{font-size:11.5px;text-anchor:middle;fill:var(--muted)}
.glabel{font-size:12.5px;font-weight:700;letter-spacing:.08em}
.alabel{font-size:12px;text-anchor:middle;fill:var(--muted)}
.alabel.blue{fill:var(--blue)} .alabel.orange{fill:var(--orange)} .alabel.red{fill:var(--red)}
.note{font-size:12px;fill:var(--muted)}
.hd{font-size:20px;font-weight:700}
.card{fill:var(--card);stroke:var(--cardline);stroke-width:1.2}
.ic{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ic .fill{fill:var(--ink);stroke:none}
.lab{fill:var(--lab)}
.a{fill:none;stroke-width:2}
.a.primary{stroke:var(--blue)} .a.secondary{stroke:var(--gray);stroke-dasharray:6 5} .a.accent{stroke:var(--orange)} .a.danger{stroke:var(--red);stroke-dasharray:6 5}
.h.primary{fill:var(--blue)} .h.secondary{fill:var(--gray)} .h.accent{fill:var(--orange)} .h.danger{fill:var(--red)}
.badge{font-size:11px;font-weight:700;text-anchor:middle;fill:#fff}
</style><defs><pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern></defs><rect width="1500" height="860" fill="var(--bg)"/><rect width="1500" height="860" fill="url(#g)"/><rect x="40" y="100" width="250" height="640" rx="14" fill="var(--f-gray)" stroke="var(--gray)" stroke-width="1.5"/><rect x="62" y="90" width="126.79999999999998" height="20" fill="var(--bg)"/><text class="glabel mono" x="68" y="104.5" style="fill:var(--gray)">INPUT / OUTPUT</text><rect x="480" y="100" width="1010" height="640" rx="14" fill="var(--f-teal)" stroke="var(--teal)" stroke-width="1.5"/><rect x="502" y="90" width="110.39999999999999" height="20" fill="var(--bg)"/><text class="glabel mono" x="508" y="104.5" style="fill:var(--teal)">CORE — core/</text><path class="a primary" d="M182.0 220.0 L608.0 220.0"/><path class="h primary" d="M608.0 220.0 L597.0 214.5 L597.0 225.5 Z"/><path class="a primary" d="M672.0 220.0 L868.0 220.0"/><path class="h primary" d="M868.0 220.0 L857.0 214.5 L857.0 225.5 Z"/><path class="a primary" d="M932.0 220.0 L1128.0 220.0"/><path class="h primary" d="M1128.0 220.0 L1117.0 214.5 L1117.0 225.5 Z"/><path class="a primary" d="M1192.0 220.0 L1330.0 220.0 L1330.0 540.0 L1192.0 540.0"/><path class="h primary" d="M1192.0 540.0 L1203.0 545.5 L1203.0 534.5 Z"/><path class="a primary" d="M182.0 540.0 L868.0 540.0"/><path class="h primary" d="M868.0 540.0 L857.0 534.5 L857.0 545.5 Z"/><path class="a secondary" d="M672.0 380.0 L780.0 380.0 L780.0 220.0"/><path class="h secondary" d="M780.0 220.0 L774.5 231.0 L785.5 231.0 Z"/><rect class="card" x="118.0" y="188.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(130.0 200.0) scale(1.000)"><path d="M10 4h14l8 8v24H10z"/><path d="M24 4v8h8M15 20h12M15 26h12M15 32h8"/></g><rect class="card" x="118.0" y="508.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(130.0 520.0) scale(1.000)"><rect x="6" y="5" width="28" height="30" rx="3"/><path d="M6 13h28M6 27h28M13 5v30M27 5v30"/></g><rect class="card" x="608.0" y="188.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(620.0 200.0) scale(1.000)"><rect x="4" y="7" width="32" height="26" rx="4"/><path d="M11 16l6 5-6 5M21 27h8"/></g><rect class="card" x="868.0" y="188.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(880.0 200.0) scale(1.000)"><circle cx="20" cy="20" r="6"/><path d="M20 4v6M20 30v6M4 20h6M30 20h6M8.7 8.7l4.2 4.2M27.1 27.1l4.2 4.2M31.3 8.7l-4.2 4.2M12.9 27.1l-4.2 4.2"/></g><rect class="card" x="1128.0" y="188.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1140.0 200.0) scale(1.000)"><path d="M5 5h14l16 16-14 14L5 19z"/><circle class="fill" cx="12" cy="12" r="2"/></g><rect class="card" x="868.0" y="508.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(880.0 520.0) scale(1.000)"><circle cx="20" cy="20" r="15"/><path d="M12 20l6 6 11-12"/></g><rect class="card" x="608.0" y="348.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(620.0 360.0) scale(1.000)"><path d="M5 5v30h30"/><path d="M10 27l7-9 6 5 9-14"/></g><rect class="card" x="1128.0" y="508.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1140.0 520.0) scale(1.000)"><circle cx="11" cy="11" r="5"/><circle cx="11" cy="29" r="5"/><path d="M15 14l20 16M15 26l20-16"/></g><text class="title" x="150" y="272.0">DXF の図面</text><text class="sub mono" x="150" y="291.0">平面図・三面図</text><text class="sub mono" x="150" y="306.0">(CP932 の文字化けに注意)</text><text class="title" x="150" y="592.0">3D メッシュ</text><text class="sub mono" x="150" y="611.0">OBJ・FBX・GLB</text><text class="title" x="640" y="272.0">parser</text><text class="sub mono" x="640" y="291.0">ルート自動判定</text><text class="sub mono" x="640" y="306.0">三面図</text><text class="title" x="900" y="272.0">floor_plan_extruder</text><text class="sub mono" x="900" y="291.0">端点スナップ・壁厚の推定</text><text class="sub mono" x="900" y="306.0">開口を切って押し出し</text><text class="title" x="1160" y="272.0">roof / texture</text><text class="sub mono" x="1160" y="291.0">屋根(陸・片流れ・切妻)</text><text class="sub mono" x="1160" y="306.0">手続き的テクスチャ</text><text class="title" x="900" y="592.0">mesh_to_dxf</text><text class="sub mono" x="900" y="611.0">Z バッファで隠線判定</text><text class="sub mono" x="900" y="626.0">numba で高速化</text><text class="title" x="640" y="432.0">GPU 推論</text><text class="sub mono" x="640" y="451.0">TripoSR・Zero123++</text><text class="sub mono" x="640" y="466.0">(--infer)</text><text class="title" x="1160" y="592.0">postprocessor</text><text class="sub mono" x="1160" y="611.0">メッシュ修復・LOD</text><text class="sub mono" x="1160" y="626.0">エクスポート</text><rect class="lab" x="377.8" y="201.0" width="34.5" height="16" rx="3"/><text class="alabel mono blue" x="395.0" y="213.0">読む</text><rect class="lab" x="988.3" y="201.0" width="83.4" height="16" rx="3"/><text class="alabel mono blue" x="1030.0" y="213.0">壁のメッシュ</text><rect class="lab" x="1256.8" y="369.0" width="78.3" height="16" rx="3"/><text class="alabel mono blue" x="1296.0" y="381.0">3D アセット</text><rect class="lab" x="445.2" y="521.0" width="159.6" height="16" rx="3"/><text class="alabel mono blue" x="525.0" y="533.0">三面図 + 平面図を DXF に</text><rect class="lab" x="690.4" y="359.0" width="71.2" height="16" rx="3"/><text class="alabel mono " x="726.0" y="371.0">外観の推論</text><text class="hd" x="40" y="44" text-anchor="start">CADGPUInferenceModeling — 構成</text><text class="note" x="40" y="66" text-anchor="start">上の流れ = 図面 → 3D / 下の流れ = 3D → 図面(青=主な流れ / 灰の破線=任意の GPU 推論)</text><text class="note" x="500" y="722" text-anchor="start">入口: cli.py(run / export / info)と api.py(FastAPI・ジョブキュー)</text></svg>
